<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AestheticFlow — CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1322; --panel:#171C31; --panel2:#1B2038; --bone:#F2ECDD;
    --rose-gold:#C9A227; --plum:#9B9FC7; --sage:#8A93AC;
    --line:rgba(242,236,221,0.12); --danger:#D97D77;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ background:var(--ink); color:var(--bone); font-family:'Inter', sans-serif; min-height:100vh; display:flex; }
  ::selection{ background:rgba(201,162,39,0.3); }

  /* Sidebar */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); padding:32px 20px;
    display:flex; flex-direction:column; gap:34px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand-mark{ font-family:'Fraunces', serif; font-weight:300; font-size:22px; padding-left:4px; }
  .brand-mark em{ font-style:italic; font-weight:450; color:var(--rose-gold); }
  nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:8px;
    color:rgba(242,236,221,0.62); text-decoration:none; font-size:13.5px; font-weight:500;
    transition:background 0.2s ease, color 0.2s ease; cursor:pointer; background:none; border:none; text-align:left; font-family:inherit;
  }
  .nav-item svg{ flex-shrink:0; opacity:0.85; }
  .nav-item:hover{ background:rgba(242,236,221,0.05); color:var(--bone); }
  .nav-item.active{ background:rgba(201,162,39,0.12); color:var(--rose-gold); border-left:2px solid var(--rose-gold); padding-left:10px; }

  /* Mobile top bar + drawer */
  .mobile-topbar{ display:none; position:fixed; top:0; left:0; right:0; height:56px; background:var(--panel); border-bottom:1px solid var(--line); align-items:center; padding:0 16px; z-index:40; gap:14px; }
  .hamburger-btn{ background:none; border:none; color:var(--bone); cursor:pointer; padding:4px; }
  .sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:55; }
  .sidebar-overlay.open{ display:block; }

  /* Main */
  .main{ flex:1; padding:36px 44px; max-width:1200px; min-width:0; display:flex; flex-direction:column; min-height:100vh; }
  #mainContent{ flex:1; }
  .site-footer{
    margin-top:48px; padding-top:20px; border-top:1px solid var(--line);
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(242,236,221,0.4);
    text-align:center;
  }
  .site-footer strong{ color:var(--rose-gold); font-weight:600; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:10px; }
  .page-title{ font-family:'Fraunces', serif; font-weight:450; font-size:26px; letter-spacing:0.01em; }
  .eyebrow{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--sage); }
  .breadcrumb{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,236,221,0.4); margin-bottom:14px; cursor:pointer; }
  .breadcrumb span{ color:var(--sage); }
  .breadcrumb span:hover{ text-decoration:underline; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px 26px; }
  .card-title{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(242,236,221,0.5); font-weight:600; margin-bottom:16px; }

  .grid2{ display:grid; grid-template-columns:1.4fr 1fr; gap:24px; }
  .grid2b{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  @media (max-width:900px){ .grid2, .grid2b, .grid3{ grid-template-columns:1fr; } }

  /* Dashboard schedule */
  .schedule-item{ display:flex; align-items:center; gap:18px; padding:14px 0; border-top:1px solid var(--line); }
  .schedule-item:first-child{ border-top:none; }
  .schedule-time{ font-family:'Fraunces', serif; font-size:16px; font-weight:450; color:var(--rose-gold); width:56px; flex-shrink:0; }
  .schedule-detail .type{ font-size:14px; font-weight:500; }
  .schedule-detail .client{ font-size:12.5px; color:rgba(242,236,221,0.5); margin-top:2px; }
  .stat-stack{ display:flex; flex-direction:column; gap:24px; }
  .stat-value{ font-family:'Fraunces', serif; font-weight:450; font-size:36px; line-height:1; }
  .stat-value.accent{ color:var(--rose-gold); }
  .stat-caption{ margin-top:10px; font-size:12px; color:var(--sage); }
  .ai-insight{ display:flex; align-items:center; justify-content:space-between; gap:16px; background:rgba(201,162,39,0.08); border:1px solid rgba(201,162,39,0.25); border-radius:8px; padding:16px 20px; margin-bottom:24px; flex-wrap:wrap; }
  .ai-insight-text{ font-size:13.5px; color:var(--bone); max-width:520px; }
  .ai-insight-text strong{ color:var(--rose-gold); }

  /* Search & inputs */
  .search-wrap{ position:relative; max-width:360px; margin-bottom:24px; }
  .search-wrap svg{ position:absolute; left:0; top:50%; transform:translateY(-50%); opacity:0.4; }
  input, select, textarea{ font-family:'Inter', sans-serif; color:var(--bone); background:transparent; }
  .search-wrap input, .field-line input, .field-line select{
    width:100%; border:none; border-bottom:1px solid rgba(242,236,221,0.25);
    font-size:14.5px; padding:9px 2px 10px; transition:border-color 0.3s ease;
  }
  .search-wrap input{ padding-left:26px; }
  input::placeholder, textarea::placeholder{ color:rgba(242,236,221,0.32); }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--rose-gold); }
  .field-line select option{ background:var(--panel); color:var(--bone); }
  .field-group{ margin-bottom:20px; }
  .field-group label{ display:block; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,236,221,0.5); margin-bottom:8px; }
  .checkbox-row{ display:flex; gap:20px; flex-wrap:wrap; }
  .checkbox-item{ display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer; }
  .checkbox-item input{ accent-color:var(--rose-gold); width:15px; height:15px; }
  textarea{ width:100%; border:1px solid rgba(242,236,221,0.2); border-radius:8px; padding:12px; font-size:13.5px; min-height:80px; resize:vertical; }
  .upload-row{ display:flex; gap:12px; }
  .upload-box{ flex:1; border:1px dashed rgba(242,236,221,0.25); border-radius:8px; padding:22px 12px; text-align:center; font-size:12px; color:rgba(242,236,221,0.5); cursor:pointer; transition:border-color 0.2s ease, color 0.2s ease; }
  .upload-box:hover{ border-color:var(--rose-gold); color:var(--rose-gold); }
  .upload-box input{ display:none; }

  /* Table */
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(242,236,221,0.5); font-weight:600; padding:16px 26px; border-bottom:1px solid var(--line); }
  tbody td{ padding:16px 26px; font-size:14px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background 0.2s ease; }
  tbody tr:hover{ background:rgba(242,236,221,0.03); }
  .name-cell{ font-family:'Fraunces', serif; font-weight:450; font-size:15px; cursor:pointer; }
  .muted{ color:rgba(242,236,221,0.55); }
  .row-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .icon-btn{ background:none; border:none; color:rgba(242,236,221,0.45); cursor:pointer; padding:4px; transition:color 0.2s ease; }
  .icon-btn:hover{ color:var(--rose-gold); }
  .icon-btn.danger:hover{ color:var(--danger); }

  .status{ display:inline-flex; align-items:center; gap:6px; padding:4px 11px 4px 9px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
  .status::before{ content:''; width:6px; height:6px; border-radius:50%; }
  .status.vip{ background:rgba(201,162,39,0.14); color:var(--rose-gold); } .status.vip::before{ background:var(--rose-gold); }
  .status.active{ background:rgba(138,147,172,0.14); color:var(--sage); } .status.active::before{ background:var(--sage); }
  .status.new{ background:rgba(155,159,199,0.22); color:#C4C8E8; } .status.new::before{ background:#C4C8E8; }

  /* Buttons */
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:8px; font-weight:600; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border:1px solid transparent; transition:background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .btn-sm{ padding:9px 16px; font-size:11px; }
  .btn-primary{ background:var(--rose-gold); color:var(--ink); }
  .btn-primary:hover{ background:#d9b48d; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--rose-gold); border-color:var(--rose-gold); }
  .btn-secondary:hover{ background:rgba(201,162,39,0.1); }
  .btn-danger{ background:var(--danger); color:#221515; }
  .btn-danger:hover{ background:#d98c8c; }
  .btn:focus-visible{ outline:2px solid var(--sage); outline-offset:3px; }
  .actions{ display:flex; gap:14px; flex-wrap:wrap; margin-top:22px; align-items:center; }

  /* Profile */
  .profile-header{ display:flex; align-items:center; gap:20px; margin-bottom:26px; justify-content:space-between; flex-wrap:wrap; }
  .profile-left{ display:flex; align-items:center; gap:20px; }
  .avatar{ width:56px; height:56px; border-radius:50%; background:rgba(201,162,39,0.14); color:var(--rose-gold); display:flex; align-items:center; justify-content:center; font-family:'Fraunces', serif; font-size:20px; font-weight:450; flex-shrink:0; }
  .profile-name{ font-family:'Fraunces', serif; font-weight:450; font-size:24px; }
  .profile-meta{ display:flex; gap:24px; margin-top:4px; flex-wrap:wrap; }
  .meta-item{ font-size:12.5px; color:rgba(242,236,221,0.55); }
  .meta-item .meta-label{ text-transform:uppercase; letter-spacing:0.08em; font-size:10.5px; color:rgba(242,236,221,0.35); display:block; margin-bottom:2px; }
  .profile-actions{ display:flex; gap:8px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:26px; flex-wrap:wrap; }
  .tab{ padding:11px 16px; font-size:13px; font-weight:500; color:rgba(242,236,221,0.5); border-bottom:2px solid transparent; transform:translateY(1px); transition:color 0.2s ease, border-color 0.2s ease; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none; font-family:inherit; }
  .tab:hover{ color:var(--bone); }
  .tab.active{ color:var(--rose-gold); border-bottom-color:var(--rose-gold); }

  .detail-row{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .detail-row:first-of-type{ border-top:none; }
  .detail-label{ color:rgba(242,236,221,0.5); }
  .detail-value{ font-weight:500; }

  .treatment-row{ display:flex; justify-content:space-between; align-items:flex-start; padding:14px 0; border-top:1px solid var(--line); gap:16px; }
  .treatment-row:first-child{ border-top:none; }
  .treatment-row .t-name{ font-family:'Fraunces', serif; font-size:15px; }
  .treatment-row .t-meta{ font-size:12px; color:rgba(242,236,221,0.5); margin-top:3px; }
  .treatment-row .t-right{ text-align:right; white-space:nowrap; }
  .treatment-row .t-date{ font-size:12.5px; color:var(--rose-gold); }
  .treatment-row .t-price{ font-size:13px; font-weight:600; margin-top:3px; }

  /* Photos */
  .photo-set{ padding:18px 0; border-top:1px solid var(--line); }
  .photo-set:first-child{ border-top:none; padding-top:0; }
  .photo-set-meta{ font-size:12.5px; color:rgba(242,236,221,0.5); margin-bottom:12px; }
  .photo-pair{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .photo-slot{ position:relative; aspect-ratio:4/3; background:var(--panel2); border-radius:8px; overflow:hidden; }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; cursor:pointer; display:block; }
  .photo-tag{ position:absolute; top:8px; left:8px; background:rgba(15,19,34,0.75); color:var(--bone); font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:3px 9px; border-radius:20px; }
  .photo-empty{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:rgba(242,236,221,0.25); font-size:12px; font-style:italic; }
  .photo-upload-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .photo-upload-slot{ aspect-ratio:4/3; border:1px dashed rgba(242,236,221,0.25); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; color:rgba(242,236,221,0.5); font-size:12px; overflow:hidden; position:relative; }
  .photo-upload-slot:hover{ border-color:var(--rose-gold); color:var(--rose-gold); }
  .photo-upload-slot img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .photo-upload-slot input{ display:none; }
  .lightbox-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:80; padding:30px; cursor:zoom-out; }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-overlay img{ max-width:100%; max-height:100%; border-radius:8px; }


  /* Calendar */
  .cal-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
  @media (max-width:900px){ .cal-grid{ grid-template-columns:1fr; } }
  .cal-day{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-height:200px; }
  .cal-day.is-today{ border-color:rgba(201,162,39,0.4); }
  .cal-day-title{ font-family:'Fraunces', serif; font-size:13.5px; color:var(--sage); margin-bottom:14px; letter-spacing:0.03em; text-transform:uppercase; display:flex; justify-content:space-between; }
  .cal-slot{ padding:9px 0; border-top:1px solid var(--line); position:relative; }
  .cal-slot:first-of-type{ border-top:none; }
  .cal-slot-time{ font-size:11.5px; color:var(--rose-gold); font-weight:600; }
  .cal-slot-title{ font-size:13px; margin-top:2px; }
  .cal-slot-meta{ font-size:11px; color:rgba(242,236,221,0.4); margin-top:2px; }
  .cal-slot-del{ position:absolute; top:8px; right:0; }
  .cal-empty{ font-size:12px; color:rgba(242,236,221,0.3); font-style:italic; }
  .cal-filters{ display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap; align-items:flex-end; }
  .cal-filters .field-line{ min-width:180px; }

  /* Kanban */
  .kanban{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; overflow-x:auto; }
  @media (max-width:1100px){ .kanban{ grid-template-columns:repeat(5, 200px); } }
  .kanban-col{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; min-height:200px; }
  .kanban-col-title{ font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,236,221,0.5); font-weight:600; margin-bottom:12px; }
  .kanban-card{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .kanban-card .lead-name{ font-family:'Fraunces', serif; font-size:14.5px; }
  .kanban-card .lead-source{ font-size:11.5px; color:rgba(242,236,221,0.5); margin-top:2px; }
  .kanban-card-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .kanban-card button.move{ font-size:10px; background:none; border:none; color:var(--rose-gold); cursor:pointer; letter-spacing:0.06em; text-transform:uppercase; padding:0; }

  /* Inventory alert */
  .alert{ display:flex; align-items:center; gap:10px; background:rgba(217,125,119,0.12); border:1px solid rgba(217,125,119,0.3); color:var(--danger); padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; }

  /* Campaign cards */
  .campaign-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; }
  .campaign-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px; position:relative; }
  .campaign-name{ font-family:'Fraunces', serif; font-size:17px; margin-bottom:14px; padding-right:24px; }
  .campaign-stat-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(242,236,221,0.4); margin-bottom:2px; }
  .campaign-stat-value{ font-size:15px; font-weight:600; margin-bottom:12px; }
  .status-pill{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border-radius:20px; cursor:pointer; border:none; }
  .status-pill.ACTIVE{ background:rgba(138,147,172,0.14); color:var(--sage); }
  .status-pill.DRAFT{ background:rgba(155,159,199,0.22); color:#C4C8E8; }
  .campaign-del{ position:absolute; top:18px; right:18px; }

  /* Reports */
  .bar-row{ display:grid; grid-template-columns:120px 1fr 70px; align-items:center; gap:14px; padding:9px 0; }
  .bar-label{ font-size:13px; }
  .bar-track{ background:rgba(242,236,221,0.08); border-radius:20px; height:8px; overflow:hidden; }
  .bar-fill{ background:var(--rose-gold); height:100%; border-radius:20px; }
  .bar-value{ font-size:12.5px; text-align:right; color:rgba(242,236,221,0.6); }

  /* Sales */
  .pie-wrap{ display:flex; align-items:center; gap:32px; flex-wrap:wrap; }
  .pie-chart{ width:170px; height:170px; border-radius:50%; flex-shrink:0; }
  .pie-legend{ display:flex; flex-direction:column; gap:10px; flex:1; min-width:180px; }
  .pie-legend-item{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .pie-legend-dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .pie-legend-value{ margin-left:auto; color:rgba(242,236,221,0.5); font-size:12.5px; }
  .sales-agent-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:14px; cursor:pointer; }
  .sales-agent-header{ display:flex; justify-content:space-between; align-items:center; }
  .sales-agent-name{ font-family:'Fraunces', serif; font-size:16px; }
  .sales-agent-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:14px; }
  .sales-agent-stat-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(242,236,221,0.4); margin-bottom:2px; }
  .sales-agent-stat-value{ font-size:15px; font-weight:600; }
  .depreciation-bar{ height:5px; border-radius:3px; background:rgba(242,236,221,0.1); overflow:hidden; margin-top:4px; }
  .depreciation-fill{ height:100%; background:var(--rose-gold); }
  .target-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px; margin-bottom:16px; }
  .target-card.met{ border-color:var(--sage); background:linear-gradient(180deg, rgba(95,128,105,0.08), var(--panel) 45%); }
  .target-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .target-name{ font-family:'Fraunces', serif; font-size:16px; }
  .target-bar{ height:10px; border-radius:6px; background:rgba(242,236,221,0.08); overflow:hidden; margin:10px 0; }
  .target-bar-fill{ height:100%; background:var(--rose-gold); border-radius:6px; transition:width 0.3s ease; }
  .target-bar-fill.met{ background:var(--sage); }
  .target-meta{ display:flex; justify-content:space-between; font-size:12px; color:rgba(242,236,221,0.55); }
  .target-bonus-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 12px; border-radius:20px; background:rgba(95,128,105,0.16); color:var(--sage); }
  .target-bonus-badge.pending{ background:rgba(242,236,221,0.08); color:rgba(242,236,221,0.4); }

  /* Invoices */
  .invoice-type-pill{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:3px 9px; border-radius:20px; }
  .invoice-type-pill.Quote{ background:rgba(155,159,199,0.16); color:#C4C8E8; }
  .invoice-type-pill.Invoice{ background:rgba(201,162,39,0.16); color:#8a6f2e; }
  .status.Draft{ background:rgba(155,159,199,0.16); color:#C4C8E8; } .status.Draft::before{ background:#C4C8E8; }
  .status.Sent{ background:rgba(201,162,39,0.16); color:#8a6f2e; } .status.Sent::before{ background:#8a6f2e; }
  .status.Paid{ background:rgba(138,147,172,0.14); color:var(--sage); } .status.Paid::before{ background:var(--sage); }

/* ---------------- Date helpers ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isoOffset(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso || iso==='—') return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function weekDates(){
  const now = new Date();
  const day = now.getDay();
  const monOffset = day===0 ? -6 : 1-day;
  const monday = new Date(now); monday.setDate(now.getDate()+monOffset);
  const days=[];
  for(let i=0;i<5;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    days.push({ iso: d.toISOString().slice(0,10), label: d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase()+' '+d.getDate() });
  }
  return days;
}

function rowsByKey(rows, key){
  const map = {};
  (rows||[]).forEach(r=>{ (map[r[key]] = map[r[key]] || []).push(r); });
  return map;
}
function mapTreatment(t){
  return { id:t.id, name:t.name, date:t.date, area:t.area||[], product:t.product||'', batch:t.batch||'',
    notes:t.notes||'', price:Number(t.price)||0, practitioner:t.practitioner, soldBy:t.sold_by,
    isNewProcedure:!!t.is_new_procedure, verified:!!t.verified, verifiedBy:t.verified_by, verifiedDate:t.verified_date };
}
function mapPhotoSet(p){ return { id:p.id, date:p.date, caption:p.caption||'', beforeUrl:p.before_url, afterUrl:p.after_url }; }
function mapDocument(d){ return { id:d.id, filename:d.filename, fileType:d.file_type, uploadedDate:d.uploaded_date, dataUrl:d.data_url }; }
function mapClient(c, treatmentsByClient, photoSetsByClient, documentsByClient){
  return {
    id:c.id, name:c.name, phone:c.phone, email:c.email, clientSince:c.client_since, status:c.status,
    locationId:c.location_id, capturedBy:c.captured_by, captureDate:c.capture_date,
    skinType:c.skin_type, concerns:c.concerns||[], medicalNotes:c.medical_notes||'',
    lastTreatment:{ name:c.last_treatment_name||'—', date:c.last_treatment_date||'—', practitioner:c.last_treatment_practitioner||'—' },
    nextAction:{ label:c.next_action_label||'Book first visit', date:c.next_action_date||'—' },
    treatments:(treatmentsByClient[c.id]||[]).map(mapTreatment),
    photoConsent:c.photo_consent,
    photoSets:(photoSetsByClient[c.id]||[]).map(mapPhotoSet),
    documents:(documentsByClient[c.id]||[]).map(mapDocument),
    authUserId:c.auth_user_id
  };
}
function mapInvoice(inv, lineItemsByInvoice){
  return { id:inv.id, invoiceNumber:inv.invoice_number, clientId:inv.client_id, clientName:inv.client_name,
    type:inv.type, status:inv.status, notes:inv.notes||'',
    lineItems:(lineItemsByInvoice[inv.id]||[]).map(li=>({ id:li.id, description:li.description, productId:li.product_id, quantity:Number(li.quantity), unitPrice:Number(li.unit_price) })),
    createdDate:inv.created_date, dueDate:inv.due_date, stockDeducted:!!inv.stock_deducted };
}

// Whole-state overwrite: deletes children-first then inserts parents-first
// to respect foreign keys. RLS scopes every delete/insert to the caller's
// own clinic_id, so this can't touch another tenant's rows — but it's still
// not safe against two staff at the same clinic saving at the exact same
// instant, same limitation the old single-JSON-blob storage already had.
async function persistStateToSupabase(s){
  await sb.from('ai_chat_messages').delete().gte('id', 0);
  await sb.from('invoice_line_items').delete().neq('id','');
  await sb.from('invoices').delete().neq('id','');
  await sb.from('treatments').delete().neq('id','');
  await sb.from('photo_sets').delete().neq('id','');
  await sb.from('documents').delete().neq('id','');
  await sb.from('leads').delete().neq('id','');
  await sb.from('clients').delete().neq('id','');
  await sb.from('appointments').delete().neq('id','');
  await sb.from('campaigns').delete().neq('id','');
  await sb.from('social_posts').delete().neq('id','');
  await sb.from('credit_transactions').delete().neq('id','');
  await sb.from('inventory').delete().neq('id','');
  await sb.from('staff').delete().neq('id','');
  await sb.from('locations').delete().neq('id','');

  if(s.locations.length) await sb.from('locations').insert(s.locations.map(l=>({ id:l.id, clinic_id:s.clinicId, name:l.name, address:l.address, phone:l.phone })));
  if(s.staff.length) await sb.from('staff').insert(s.staff.map(st=>({ id:st.id, clinic_id:s.clinicId, name:st.name, role:st.role, location_id:st.locationId, commission_rate:st.commissionRate, license_expiry:st.licenseExpiry||null, sales_target:st.salesTarget, target_bonus_percent:st.targetBonusPercent, email:st.email||null, auth_user_id:st.authUserId||null })));
  if(s.inventory.length) await sb.from('inventory').insert(s.inventory.map(i=>({ id:i.id, clinic_id:s.clinicId, name:i.name, stock:i.stock, expires_in:i.expiresIn||null, price:i.price||0 })));
  if(s.clients.length) await sb.from('clients').insert(s.clients.map(c=>({
    id:c.id, clinic_id:s.clinicId, name:c.name, phone:c.phone, email:c.email, client_since:c.clientSince, status:c.status,
    location_id:c.locationId, captured_by:c.capturedBy, capture_date:c.captureDate||null,
    skin_type:c.skinType, concerns:c.concerns||[], medical_notes:c.medicalNotes||'',
    last_treatment_name:(c.lastTreatment&&c.lastTreatment.name)||'—', last_treatment_date:(c.lastTreatment&&c.lastTreatment.date)||'—', last_treatment_practitioner:(c.lastTreatment&&c.lastTreatment.practitioner)||'—',
    next_action_label:(c.nextAction&&c.nextAction.label)||'Book first visit', next_action_date:(c.nextAction&&c.nextAction.date)||'—',
    photo_consent:c.photoConsent||null, auth_user_id:c.authUserId||null
  })));

  const allTreatments = [], allPhotoSets = [], allDocuments = [];
  s.clients.forEach(c=>{
    (c.treatments||[]).forEach(t=>{
      allTreatments.push({
        id: t.id || ('t'+Date.now()+Math.random().toString(36).slice(2,8)),
        clinic_id:s.clinicId, client_id:c.id, name:t.name, date:t.date, area:t.area||[], product:t.product||'', batch:t.batch||'',
        notes:t.notes||'', price:t.price||0, practitioner:t.practitioner, sold_by:t.soldBy||null,
        is_new_procedure:!!t.isNewProcedure, verified:!!t.verified, verified_by:t.verifiedBy||null, verified_date:t.verifiedDate||null
      });
    });
    (c.photoSets||[]).forEach(p=>{ allPhotoSets.push({ id:p.id, clinic_id:s.clinicId, client_id:c.id, date:p.date, caption:p.caption||'', before_url:p.beforeUrl||null, after_url:p.afterUrl||null }); });
    (c.documents||[]).forEach(d=>{ allDocuments.push({ id:d.id, clinic_id:s.clinicId, client_id:c.id, filename:d.filename, file_type:d.fileType, uploaded_date:d.uploadedDate||null, data_url:d.dataUrl||null }); });
  });
  if(allTreatments.length) await sb.from('treatments').insert(allTreatments);
  if(allPhotoSets.length) await sb.from('photo_sets').insert(allPhotoSets);
  if(allDocuments.length) await sb.from('documents').insert(allDocuments);

  if(s.appointments.length) await sb.from('appointments').insert(s.appointments.map(a=>({ id:a.id, clinic_id:s.clinicId, client_id:a.clientId||null, client_name:a.clientName, date:a.date, time:a.time, service:a.service, practitioner:a.practitioner, location_id:a.locationId||null })));
  if(s.leads.length) await sb.from('leads').insert(s.leads.map(l=>({ id:l.id, clinic_id:s.clinicId, name:l.name, source:l.source, stage:l.stage, owner_id:l.ownerId||null, converted_client_id:l.convertedClientId||null })));

  if(s.invoices.length) await sb.from('invoices').insert(s.invoices.map(inv=>({ id:inv.id, clinic_id:s.clinicId, invoice_number:inv.invoiceNumber, client_id:inv.clientId||null, client_name:inv.clientName, type:inv.type, status:inv.status, notes:inv.notes||'', created_date:inv.createdDate||null, due_date:inv.dueDate||null, stock_deducted:!!inv.stockDeducted })));
  const allLineItems = [];
  s.invoices.forEach(inv=>{ (inv.lineItems||[]).forEach(li=>{ allLineItems.push({ id:li.id, clinic_id:s.clinicId, invoice_id:inv.id, description:li.description, product_id:li.productId||null, quantity:li.quantity, unit_price:li.unitPrice }); }); });
  if(allLineItems.length) await sb.from('invoice_line_items').insert(allLineItems);

  if(s.campaigns.length) await sb.from('campaigns').insert(s.campaigns.map(k=>({ id:k.id, clinic_id:s.clinicId, name:k.name, type:k.type, subject:k.subject||'', body:k.body||'', audience:k.audience||'all', clients_count:k.clients||0, status:k.status })));
  if(s.socialPosts.length) await sb.from('social_posts').insert(s.socialPosts.map(p=>({ id:p.id, clinic_id:s.clinicId, content_type:p.contentType, media_url:p.mediaUrl||null, media_filename:p.mediaFilename||null, treatment_context:p.treatmentContext||null, caption:p.caption||'', hashtags:p.hashtags||'', platforms:p.platforms||[] })));
  if(s.creditTransactions.length) await sb.from('credit_transactions').insert(s.creditTransactions.map(t=>({ id:t.id, clinic_id:s.clinicId, type:t.type, amount:t.amount, reason:t.reason||null, date:t.date||null })));
  if(s.aiChat.length) await sb.from('ai_chat_messages').insert(s.aiChat.map(m=>({ clinic_id:s.clinicId, from_role:m.from, text:m.text, suggest_campaign:!!m.suggestCampaign, suggest_invoice_for:m.suggestInvoiceFor||null, suggest_invoice_type:m.suggestInvoiceType||null })));

  await sb.from('clinic_settings').upsert({
    clinic_id:s.clinicId, name:s.clinic.name, practitioner_name:s.clinic.practitionerName, logo_url:s.clinic.logoUrl||null, currency:s.clinic.currency,
    origination_commission_rate:s.clinic.originationCommissionRate, depreciation_period_years:s.clinic.depreciationPeriodYears,
    org_sales_target:s.clinic.orgSalesTarget, org_bonus_percent:s.clinic.orgBonusPercent,
    api_key:s.apiKey, content_credits:s.contentCredits, current_location_id:s.currentLocationId||null,
    current_staff_id:s.currentStaffId||null, next_invoice_seq:s.nextInvoiceSeq
  });
}

}

/* ---------------- Render helpers ---------------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function esc(str){ const d=document.createElement('div'); d.textContent=String(str==null?'':str); return d.innerHTML; }

function showToast(msg){
  const c = document.getElementById('toastContainer');
  const t = el(`<div class="toast">${esc(msg)}</div>`);
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(), 300); }, 2200);
}

/**
 * Copies text with two real attempts before giving up: the modern Clipboard
 * API first, then the older execCommand('copy') trick (works in some
 * sandboxed embeds that block the former). If both fail — common inside
 * sandboxed iframes like Claude's own artifact viewer, which often don't
 * grant clipboard-write permission to embedded content — falls back to a
 * modal with the text pre-selected, so the person's own native long-press
 * copy gesture works instead. That gesture is OS-level, not JS-permission
 * gated, so it works even when both programmatic methods are blocked.
 */
async function copyToClipboard(text, successMsg){
  try{
    await navigator.clipboard.writeText(text);
    showToast(successMsg || 'Copied');
    return;
  }catch(e){ /* fall through to legacy method */ }

  try{
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    const ok = document.execCommand('copy');
    textarea.remove();
    if(ok){ showToast(successMsg || 'Copied'); return; }
  }catch(e){ /* fall through to manual-select modal */ }

  showCopyFallbackModal(text);
}

function showCopyFallbackModal(text){

/* ---------------- Computed data ---------------- */
function allTreatments(){
  const out = [];
  state.clients.forEach(c=>{ c.treatments.forEach(t=>out.push({...t, clientName:c.name, locationId:c.locationId})); });
  return out;
}
function monthlyRevenue(){
  const now = new Date();
  return allTreatments()
    .filter(t=>{ const d=new Date(t.date+'T00:00:00'); return !isNaN(d) && d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); })
    .reduce((sum,t)=>sum + (Number(t.price)||0), 0);
}

function revenueForMonthOffset(monthsAgo){
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth()-monthsAgo, 1);
  return allTreatments()
    .filter(t=>{ const d=new Date(t.date+'T00:00:00'); return !isNaN(d) && d.getMonth()===target.getMonth() && d.getFullYear()===target.getFullYear(); })
    .reduce((sum,t)=>sum + (Number(t.price)||0), 0);
}

function bookingCountForMonthOffset(monthsAgo){
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth()-monthsAgo, 1);
  return allTreatments()
    .filter(t=>{ const d=new Date(t.date+'T00:00:00'); return !isNaN(d) && d.getMonth()===target.getMonth() && d.getFullYear()===target.getFullYear(); }).length;
}

// Generates a real month-over-month insight from actual treatment data where
// there's enough history to compare; falls back to a generic prompt otherwise
// rather than asserting a fabricated trend.
function generateAIInsight(){
  const thisMonthBookings = bookingCountForMonthOffset(0);
  const lastMonthBookings = bookingCountForMonthOffset(1);
  if(lastMonthBookings > 0){
    const pctChange = Math.round(((thisMonthBookings - lastMonthBookings) / lastMonthBookings) * 100);
    if(pctChange <= -10){
      return { text:`Bookings are down ${Math.abs(pctChange)}% compared to last month (${thisMonthBookings} vs ${lastMonthBookings}). Would you like me to create a re-engagement campaign?`, suggestCampaign:true };
    }
    if(pctChange >= 10){
      return { text:`Bookings are up ${pctChange}% compared to last month (${thisMonthBookings} vs ${lastMonthBookings}) — nice momentum.`, suggestCampaign:false };
    }
    return { text:`Bookings are steady month over month (${thisMonthBookings} this month vs ${lastMonthBookings} last month).`, suggestCampaign:false };
  }
  return { text:`I don't have enough treatment history yet to compare months — log a few more treatments and I'll start spotting trends.`, suggestCampaign:false };
}

  });

// Draft line items live here while the builder modal is open, since the modal
// re-renders its own inner HTML on every add/remove line without a full app render().
let _invoiceDraft = null;

function openInvoiceBuilderModal(prefillClientId, type){
  _invoiceDraft = {
    clientId: prefillClientId || (state.clients[0] && state.clients[0].id) || '',
    type: type || 'Invoice',
    lineItems: [{ id:'li'+Date.now(), description:'', productId:'', quantity:1, unitPrice:0 }],
    notes:''
  };
  renderInvoiceBuilderModal();
}

function renderInvoiceBuilderModal(){
  const d = _invoiceDraft;
  const total = d.lineItems.reduce((sum,li)=>sum + (Number(li.quantity)||0)*(Number(li.unitPrice)||0), 0);
  openModal(`
    <div class="modal-title">New ${d.type}</div>
    <div class="field-group"><label>Client</label><div class="field-line"><select id="invClient">
      ${state.clients.map(c=>`<option value="${c.id}" ${c.id===d.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}

    <div class="field-group"><label>Type</label><div class="field-line"><select id="invType">
      <option ${d.type==='Quote'?'selected':''}>Quote</option>
      <option ${d.type==='Invoice'?'selected':''}>Invoice</option>
    </select></div></div>
    <div class="field-group">
      <label>Line Items</label>
      <div id="lineItemsWrap">
        ${d.lineItems.map((li,idx)=>`
          <div class="line-item-row" data-line="${li.id}">
            <div>
              <label>Item</label>
              <select class="li-product" data-line="${li.id}">
                <option value="" ${!li.productId?'selected':''}>Custom / Service...</option>
                ${state.inventory.map(p=>`<option value="${p.id}" ${li.productId===p.id?'selected':''}>${esc(p.name)} (${p.stock} in stock)</option>`).join('')}
              </select>
              ${!li.productId ? `<input class="li-desc" data-line="${li.id}" type="text" value="${esc(li.description)}" placeholder="Description" style="margin-top:8px; width:100%; border:none; border-bottom:1px solid rgba(242,236,221,0.25); padding:6px 2px; font-size:13px;">` : ''}
            </div>
            <div><label>Qty</label><input class="li-qty" data-line="${li.id}" type="number" min="1" value="${li.quantity}" style="width:100%; border:none; border-bottom:1px solid rgba(242,236,221,0.25); padding:6px 2px;"></div>
            <div><label>Price</label><input class="li-price" data-line="${li.id}" type="number" value="${li.unitPrice}" style="width:100%; border:none; border-bottom:1px solid rgba(242,236,221,0.25); padding:6px 2px;"></div>
            <button class="line-item-remove" data-remove-line="${li.id}" title="Remove">${ICONS.trash}</button>
          </div>`).join('')}
      </div>
      <button class="btn btn-secondary btn-sm" id="addLineBtn" type="button">${ICONS.plus} Add Line</button>
    </div>
    <div class="invoice-total-row"><span>Total</span><span>${fmtMoney(total)}</span></div>
    <div class="field-group" style="margin-top:16px;"><label>Notes</label><textarea id="invNotes" placeholder="Payment terms, thank-you note, etc.">${esc(d.notes)}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveInvoiceBtn">Save ${d.type}</button>
    </div>`);

  document.getElementById('invClient').addEventListener('change', e=>{ d.clientId = e.target.value; });
  document.getElementById('invType').addEventListener('change', e=>{ d.type = e.target.value; renderInvoiceBuilderModal(); });

  document.querySelectorAll('.li-product').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const li = d.lineItems.find(x=>x.id===e.target.dataset.line);
      const product = state.inventory.find(p=>p.id===e.target.value);
      li.productId = e.target.value || '';
      if(product){ li.description = product.name; li.unitPrice = product.price || 0; }
      else { li.description = ''; }
      renderInvoiceBuilderModal();
    });
  });
  document.querySelectorAll('.li-desc').forEach(inp=>{
    inp.addEventListener('input', e=>{ d.lineItems.find(x=>x.id===e.target.dataset.line).description = e.target.value; });
  });
  document.querySelectorAll('.li-qty').forEach(inp=>{
    inp.addEventListener('input', e=>{ d.lineItems.find(x=>x.id===e.target.dataset.line).quantity = Number(e.target.value)||0; updateInvoiceTotalDisplay(); });
  });
  document.querySelectorAll('.li-price').forEach(inp=>{
    inp.addEventListener('input', e=>{ d.lineItems.find(x=>x.id===e.target.dataset.line).unitPrice = Number(e.target.value)||0; updateInvoiceTotalDisplay(); });
  });
  document.querySelectorAll('[data-remove-line]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(d.lineItems.length<=1) return;
      d.lineItems = d.lineItems.filter(x=>x.id!==btn.dataset.removeLine);
      renderInvoiceBuilderModal();
    });
  });
  document.getElementById('addLineBtn').addEventListener('click', ()=>{
    d.lineItems.push({ id:'li'+Date.now(), description:'', productId:'', quantity:1, unitPrice:0 });
    renderInvoiceBuilderModal();
  });
  document.getElementById('invNotes').addEventListener('input', e=>{ d.notes = e.target.value; });

  document.getElementById('saveInvoiceBtn').addEventListener('click', async ()=>{
    const client = state.clients.find(c=>c.id===d.clientId);
    if(!client){ showToast('Select a client first'); return; }
    const validLines = d.lineItems.filter(li=>li.description.trim() || li.productId);
    if(!validLines.length){ showToast('Add at least one line item'); return; }
    const invoiceNumber = `${d.type==='Quote'?'QUO':'INV'}-${String(state.nextInvoiceSeq).padStart(4,'0')}`;
    const invoice = {
      id:'inv'+Date.now(), invoiceNumber, clientId:client.id, clientName:client.name, type:d.type, status:'Draft',
      lineItems:validLines, notes:d.notes, createdDate:todayISO(), dueDate:isoOffset(7), stockDeducted:false
    };
    state.nextInvoiceSeq++;
    state.invoices.push(invoice);
    await saveState();
    _invoiceDraft = null;
    closeModal();
    activeClientId = null;
    activeView = 'invoices';
    render();
    showToast(`${d.type} created for ${client.name}`);
  });
}

function deductInventoryForInvoice(invoice){
  if(invoice.stockDeducted) return;
  invoice.lineItems.forEach(li=>{
    if(li.productId){
      const product = state.inventory.find(p=>p.id===li.productId);
      if(product) product.stock = Math.max(0, product.stock - (Number(li.quantity)||0));
    }
  });
  invoice.stockDeducted = true;
}

function downloadCsv(filename, rows){
  const csv = rows.map(row => row.map(cell=>{
    const s = String(cell==null?'':cell);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Staff performance is computed from each client's individual treatment
// records (not the flattened allTreatments() helper's practitioner-less
// shape), matching on the practitioner name string recorded at the time
// each treatment was logged.
/**
 * The core of the depreciating origination-commission model: how much of
 * the full commission rate the originating agent still earns on a given
 * client, based on how long ago that client was captured relative to the
 * clinic's configured depreciation period. Decays linearly to zero — after
 * the full period, the client is considered fully absorbed into the
 * company and the originator earns nothing further from them.
 */
function originationMultiplier(captureDate){
  if(!captureDate) return 0;
  const periodDays = (state.clinic.depreciationPeriodYears || 2) * 365;
  const daysSince = Math.floor((new Date() - new Date(captureDate+'T00:00:00')) / 86400000);
  if(daysSince >= periodDays) return 0;
  return Math.max(0, 1 - (daysSince / periodDays));
}

/**
 * For a given client, finds the "anchor" treatment for each distinct
 * procedure name they've had — the first time that specific procedure was
 * ever sold to them. That anchor's seller and date drive the depreciation
 * clock for every future instance of that same procedure for that client,
 * per the accountability model: an upsell into something new starts its
 * own clock under whoever sold it; a repeat of an existing procedure rides
 * on the original sale, it doesn't reset or reassign.
 */
function getProcedureAnchors(client){
  const anchors = {};
  const sorted = [...client.treatments].sort((a,b)=>a.date.localeCompare(b.date));
  sorted.forEach(t=>{
    if(!anchors[t.name]){
      anchors[t.name] = {
        soldBy: t.soldBy || client.capturedBy,
        date: t.date,
        // Legacy treatments logged before this model existed have no
        // `verified` field at all — treated as already-settled rather than
        // retroactively blocking commission on old data.
        verified: t.verified !== undefined ? t.verified : true,
      };
    }
  });
  return anchors;
}

function getPendingApprovals(){
  const pending = [];
  state.clients.forEach(c=>{
    c.treatments.forEach(t=>{
      if(t.isNewProcedure && t.verified===false){
        pending.push({ clientId:c.id, clientName:c.name, treatment:t });
      }
    });
  });
  return pending;
}

function computeSalesMetrics(){
  const rate = (state.clinic.originationCommissionRate || 0) / 100;
  const now = new Date();

  return state.staff.map(s=>{
    const clientSet = new Set();
    const creditedProcedures = [];
    let allTimeRevenue = 0, thisMonthRevenue = 0, lastMonthRevenue = 0, commissionOwed = 0;

    state.clients.forEach(c=>{
      const anchors = getProcedureAnchors(c);
      Object.entries(anchors).forEach(([procName, anchor])=>{
        if(anchor.soldBy !== s.id || !anchor.verified) return;
        clientSet.add(c.id);
        const mult = originationMultiplier(anchor.date);
        let procRevenue = 0;
        c.treatments.filter(t=>t.name===procName).forEach(t=>{
          const price = Number(t.price)||0;
          const d = new Date(t.date+'T00:00:00');
          allTimeRevenue += price;
          procRevenue += price;
          if(!isNaN(d) && d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear()){
            thisMonthRevenue += price;
            commissionOwed += price * mult * rate;
          }
          const lm = new Date(now.getFullYear(), now.getMonth()-1, 1);
          if(!isNaN(d) && d.getMonth()===lm.getMonth() && d.getFullYear()===lm.getFullYear()){
            lastMonthRevenue += price;
          }
        });
        creditedProcedures.push({ clientName:c.name, procedureName:procName, saleDate:anchor.date, multiplier:mult, revenue:procRevenue });
      });
    });

    const growthFactor = lastMonthRevenue > 0 ? (thisMonthRevenue / lastMonthRevenue) : 1;
    const projectedNextMonth = thisMonthRevenue * growthFactor * rate;

    return {
      staffId: s.id, name: s.name, role: s.role,
      clientCount: clientSet.size, allTimeRevenue, thisMonthRevenue,
      commissionOwed, projectedNextMonth, creditedProcedures
    };
  }).filter(m => m.clientCount > 0 || m.staffId === state.currentStaffId);
}

function computeStaffPerformance(){
  const now = new Date();
  return state.staff
    .filter(s => ['Doctor','Nurse','Therapist'].includes(s.role))
    .map(s=>{
      let treatmentCount = 0;
      let revenue = 0;
      state.clients.forEach(c=>{
        (c.treatments||[]).forEach(t=>{
          if(t.practitioner === s.name){
            treatmentCount++;
            revenue += Number(t.price)||0;
          }
        });
      });
      const commission = revenue * (Number(s.commissionRate)||0) / 100;
      const licenseDaysLeft = s.licenseExpiry ? Math.ceil((new Date(s.licenseExpiry+'T00:00:00') - now) / 86400000) : null;
      return { name:s.name, role:s.role, treatmentCount, revenue, commission, commissionRate:s.commissionRate, licenseDaysLeft };
    });
}

function getAtRiskClients(){
  const today = new Date();
  return state.clients.filter(c=>{
    if(!c.lastTreatment.date || c.lastTreatment.date==='—') return false;
    const last = new Date(c.lastTreatment.date+'T00:00:00');
    if(isNaN(last)) return false;
    const daysSince = Math.floor((today - last) / (1000*60*60*24));
    const overdue = c.nextAction && c.nextAction.date && c.nextAction.date!=='—' && new Date(c.nextAction.date+'T00:00:00') < today;
    return daysSince > 90 || overdue;
  });
}

/**
 * Computes the Sales Target Board: an organization-wide monthly revenue
 * target (if hit, every eligible staff member gets the same bonus %) and
 * per-person targets tied to their own sales-origination revenue this
 * month (if hit, they earn their own bonus % on top).
 */
/**
 * Pulls together everything in the CRM that genuinely deserves attention
 * right now, from five real sources that previously only surfaced if you
 * happened to visit that specific tab. Each notification links to the
 * view where it can actually be acted on.
 */
function openNotificationsPanel(){
  const notifs = computeNotifications();
  const severityColor = { danger:'var(--danger)', warning:'var(--rose-gold)', success:'var(--sage)', info:'var(--sage)' };
  const severityIcon = { danger:'⚠', warning:'⚠', success:'✓', info:'ℹ' };
  openModal(`
    <div class="modal-title">Notifications</div>
    ${notifs.length ? notifs.map((n,i)=>`
      <div class="detail-row" data-notif-view="${n.view}" style="cursor:pointer;">
        <span class="detail-label" style="color:${severityColor[n.severity]};">${severityIcon[n.severity]} ${esc(n.text)}</span>
      </div>`).join('') : `<p class="empty-state">Nothing needs attention right now.</p>`}
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelModal">Close</button>
    </div>`);
  document.querySelectorAll('[data-notif-view]').forEach(row=>{
    row.addEventListener('click', ()=>{
      closeModal();
      activeView = row.dataset.notifView;
      activeClientId = null;
      render();
    });
  });
}

function computeNotifications(){
  const notifs = [];
  const perms = currentPerms();

  // License/certification expiry (Settings/Reports)
  if(perms.canManageStaff){
    state.staff.forEach(s=>{
      if(!s.licenseExpiry) return;
      const daysLeft = Math.ceil((new Date(s.licenseExpiry+'T00:00:00') - new Date()) / 86400000);
      if(daysLeft < 0) notifs.push({ severity:'danger', view:'settings', text:`${s.name}'s license has expired` });
      else if(daysLeft <= 30) notifs.push({ severity:'warning', view:'settings', text:`${s.name}'s license expires in ${daysLeft}d` });
    });
  }

  // Pending sales approvals (Sales Team)
  if(perms.canManageStaff){
    getPendingApprovals().forEach(p=>{
      notifs.push({ severity:'warning', view:'sales', text:`${p.treatment.name} for ${p.clientName} needs sale approval` });
    });
  }

  // Low stock / expiring inventory (Inventory)
  if(perms.nav.includes('inventory')){
    state.inventory.forEach(i=>{
      if(i.stock <= 5) notifs.push({ severity:'warning', view:'inventory', text:`${i.name} is low on stock (${i.stock} left)` });
      if(i.expiresIn && i.expiresIn <= 30) notifs.push({ severity:'warning', view:'inventory', text:`${i.name} expires in ${i.expiresIn}d` });
    });
  }

  // At-risk clients (Reports)
  if(perms.nav.includes('reports')){
    const atRisk = getAtRiskClients();
    if(atRisk.length) notifs.push({ severity:'info', view:'reports', text:`${atRisk.length} client${atRisk.length===1?'':'s'} at risk of lapsing` });
  }

  // Target-met moments (Sales Team)
  if(perms.nav.includes('sales')){
    const targets = computeSalesTargets();
    if(targets.org.met) notifs.push({ severity:'success', view:'sales', text:`Organization target met — everyone's bonus is active` });
    targets.individuals.forEach(t=>{
      if(t.met && t.staffId===state.currentStaffId) notifs.push({ severity:'success', view:'sales', text:`You hit your sales target — ${fmtMoney(t.individualBonus)} bonus earned` });
    });
  }

  return notifs;
}

function computeSalesTargets(){
  const orgRevenue = monthlyRevenue();
  const orgTarget = state.clinic.orgSalesTarget || 0;
  const orgMet = orgTarget > 0 && orgRevenue >= orgTarget;
  const orgProgress = orgTarget > 0 ? Math.min(100, (orgRevenue/orgTarget*100)) : 0;

  const salesMetrics = computeSalesMetrics();

  const individuals = state.staff
    .filter(s => s.salesTarget > 0)
    .map(s=>{
      const metric = salesMetrics.find(m=>m.staffId===s.id);
      const revenue = metric ? metric.thisMonthRevenue : 0;
      const met = revenue >= s.salesTarget;
      const progress = Math.min(100, (revenue / s.salesTarget * 100));
      const individualBonus = met ? revenue * (s.targetBonusPercent||0) / 100 : 0;
      const orgBonusShare = orgMet ? revenue * (state.clinic.orgBonusPercent||0) / 100 : 0;
      return {
        staffId: s.id, name: s.name, revenue, target: s.salesTarget, met, progress,
        bonusPercent: s.targetBonusPercent||0, individualBonus, orgBonusShare,
        totalBonus: individualBonus + orgBonusShare
      };
    });

  return {
    org: { revenue: orgRevenue, target: orgTarget, met: orgMet, progress: orgProgress, bonusPercent: state.clinic.orgBonusPercent||0 },
    individuals
  };
}

function renderReports(){
  const clients = state.clients;
  const counts = { vip:0, active:0, new:0 };
  clients.forEach(c=>{ if(counts[c.status]!==undefined) counts[c.status]++; });
  const treatments = allTreatments();
  const revenue = monthlyRevenue();

  const spendByClient = {};
  treatments.forEach(t=>{ spendByClient[t.clientName] = (spendByClient[t.clientName]||0) + (Number(t.price)||0); });
  const topClients = Object.entries(spendByClient).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxClientSpend = Math.max(1, ...topClients.map(x=>x[1]));

  const treatmentTotals = {};
  treatments.forEach(t=>{ treatmentTotals[t.name] = (treatmentTotals[t.name]||0) + 1; });
  const topTreatments = Object.entries(treatmentTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxTreatmentCount = Math.max(1, ...topTreatments.map(x=>x[1]));

  const monthLabels = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    monthLabels.push({ label: d.toLocaleDateString('en-GB',{month:'short'}), revenue: revenueForMonthOffset(i) });
  }
  const maxMonthRevenue = Math.max(1, ...monthLabels.map(m=>m.revenue));

  const atRiskClients = getAtRiskClients();

  const revenueByLocation = state.locations.map(l=>{
    const locClientNames = new Set(state.clients.filter(c=>c.locationId===l.id).map(c=>c.name));
    const total = treatments.filter(t=>locClientNames.has(t.clientName)).reduce((sum,t)=>sum+(Number(t.price)||0), 0);
    return { name:l.name, total };
  });
  const maxLocationRevenue = Math.max(1, ...revenueByLocation.map(l=>l.total));

  return `
    <div class="topbar">
      <div class="page-title">Reports</div>
      <div class="eyebrow">Based on recorded data</div>
    </div>
    <div class="grid3" style="margin-bottom:24px;">
      <div class="card"><div class="card-title">Total Clients</div><div class="stat-value">${clients.length}</div><div class="stat-caption">${counts.vip} VIP · ${counts.active} Active · ${counts.new} New</div></div>
      <div class="card"><div class="card-title">Revenue This Month</div><div class="stat-value accent">${fmtMoney(revenue)}</div><div class="stat-caption">${treatments.length} treatments logged total</div></div>
      <div class="card"><div class="card-title">Sales Pipeline</div><div class="stat-value">${state.leads.length}</div><div class="stat-caption">${state.leads.filter(l=>l.stage==='Completed').length} converted</div></div>
    </div>
    ${state.locations.length > 1 ? `
    <div class="card" style="margin-bottom:24px;">
      <div class="card-title">Revenue by Location</div>
      ${revenueByLocation.map(l=>`
        <div class="bar-row">
          <div class="bar-label">${esc(l.name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(l.total/maxLocationRevenue*100).toFixed(0)}%"></div></div>
          <div class="bar-value">${fmtMoney(l.total)}</div>
        </div>`).join('')}
    </div>` : ''}
    <div class="card" style="margin-bottom:24px;">
      <div class="card-title">Revenue — Last 6 Months</div>
      ${monthLabels.map(m=>`
        <div class="bar-row">
          <div class="bar-label">${m.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(m.revenue/maxMonthRevenue*100).toFixed(0)}%"></div></div>
          <div class="bar-value">${fmtMoney(m.revenue)}</div>
        </div>`).join('')}
    </div>
    <div class="grid2b" style="margin-bottom:24px;">
      <div class="card">
        <div class="card-title">Top Clients by Spend</div>
        ${topClients.length ? topClients.map(([name,total])=>`
          <div class="bar-row">
            <div class="bar-label">${esc(name)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(total/maxClientSpend*100).toFixed(0)}%"></div></div>
            <div class="bar-value">${fmtMoney(total)}</div>
          </div>`).join('') : `<p class="empty-state">No treatments logged yet.</p>`}
      </div>
      <div class="card">
        <div class="card-title">Popular Treatments</div>
        ${topTreatments.length ? topTreatments.map(([name,count])=>`
          <div class="bar-row">
            <div class="bar-label">${esc(name)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(count/maxTreatmentCount*100).toFixed(0)}%"></div></div>
            <div class="bar-value">${count}×</div>
          </div>`).join('') : `<p class="empty-state">No treatments logged yet.</p>`}
      </div>
    </div>
    <div class="card" style="margin-bottom:24px;">
      <div class="card-title">At-Risk Clients</div>
      <p class="muted" style="font-size:12.5px; margin-bottom:14px;">Overdue for follow-up, or no treatment in 90+ days.</p>
      ${atRiskClients.length ? atRiskClients.map(c=>`
        <div class="detail-row">
          <span class="detail-label">${esc(c.name)}</span>
          <span class="detail-value">Last visit ${fmtDate(c.lastTreatment.date)}</span>
        </div>`).join('') : `<p class="empty-state">No clients currently flagged as at-risk.</p>`}
    </div>
    <div class="card">
      <div class="card-title">Staff Performance &amp; Commission</div>
      <p class="muted" style="font-size:12.5px; margin-bottom:14px;">Computed from treatments actually logged against each practitioner — set commission rates and license expiry in Settings → Staff.</p>
      ${(() => {
        const perf = computeStaffPerformance();
        if(!perf.length) return `<p class="empty-state">No commission-eligible staff (Doctor/Nurse/Therapist) yet.</p>`;
        return perf.map(p=>`
          <div class="treatment-row">
            <div>
              <div class="t-name">${esc(p.name)}</div>
              <div class="t-meta">${p.treatmentCount} treatment${p.treatmentCount===1?'':'s'} logged · ${p.commissionRate||0}% commission
                ${p.licenseDaysLeft!==null ? (p.licenseDaysLeft<0 ? ` · <span style="color:var(--danger);">License expired</span>` : p.licenseDaysLeft<=30 ? ` · <span style="color:var(--danger);">License expires in ${p.licenseDaysLeft}d</span>` : ` · License valid`) : ''}
              </div>
            </div>
            <div class="t-right">
              <div class="t-date">${fmtMoney(p.revenue)} revenue</div>
              <div class="t-price">${fmtMoney(p.commission)} owed</div>
            </div>
          </div>`).join('');
      })()}
    </div>`;
}

/* ---- Team Chat (genuinely shared across everyone using this CRM instance) ---- */
let teamChatMessages = null; // null = not loaded yet, [] = loaded and empty
let teamChatLoading = false;

async function loadTeamChat(){
  try{
    const { data, error } = await sb.from('team_chat_messages').select('*').order('id', {ascending:true});
    if(error) throw error;
    teamChatMessages = (data||[]).map(m=>{
      const d = new Date(m.created_at);
      return { id:'tc'+m.id, staffId:m.staff_id, staffName:m.staff_name, text:m.text, date:d.toISOString().slice(0,10), time:d.toTimeString().slice(0,5) };
    });
  }catch(e){
    teamChatMessages = [];
  }
}
// Appends just the new message rather than rewriting the whole table, so
// concurrent senders can't clobber each other's messages.
async function saveTeamChat(message){
  try{ await sb.from('team_chat_messages').insert({ clinic_id:state.clinicId, staff_id:message.staffId, staff_name:message.staffName, text:message.text }); }
  catch(e){ showToast('⚠ Message may not have saved — storage error'); }
}

function renderTeamChat(){
  if(teamChatMessages === null){
    if(!teamChatLoading){
      teamChatLoading = true;
      loadTeamChat().then(()=>{ teamChatLoading = false; if(activeView==='teamchat') render(); });
    }
    return `
      <div class="topbar"><div class="page-title">Team Chat</div></div>
      <p class="empty-state">Loading…</p>`;
  }
  const me = state.staff.find(s=>s.id===state.currentStaffId);
  return `
    <div class="topbar">
      <div class="page-title">Team Chat</div>
      <div class="eyebrow">Work-related only — visible to everyone using this CRM</div>
    </div>
    <div class="chat-window" id="teamChatWindow">
      ${teamChatMessages.length ? teamChatMessages.map(m=>`
        <div class="chat-bubble ${m.staffId===state.currentStaffId?'user':'ai'}">
          <div style="font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--rose-gold); margin-bottom:4px;">${esc(m.staffName)}</div>
          ${esc(m.text).replace(/\n/g,'<br>')}
          <div style="font-size:10.5px; color:rgba(242,236,221,0.35); margin-top:4px;">${fmtDate(m.date)} · ${esc(m.time)}</div>
        </div>`).join('') : `<p class="empty-state">No messages yet — say hello to the team.</p>`}
    </div>
    <div class="chat-input-row">
      <input id="teamChatInput" type="text" placeholder="Work-related message...">
      <button class="btn btn-primary" id="teamChatSendBtn">Send</button>
    </div>`;
}

function bindTeamChatEvents(){
  const win = document.getElementById('teamChatWindow');
  if(win) win.scrollTop = win.scrollHeight;
  const sendBtn = document.getElementById('teamChatSendBtn');
  if(!sendBtn) return; // still loading

  const send = async ()=>{
    const input = document.getElementById('teamChatInput');
    const text = input.value.trim();
    if(!text) return;
    const me = state.staff.find(s=>s.id===state.currentStaffId);
    const now = new Date();
    const newMsg = {
      id:'tc'+Date.now(), staffId:state.currentStaffId, staffName: me ? me.name : 'Unknown',
      text, date: todayISO(), time: now.toTimeString().slice(0,5)
    };
    teamChatMessages.push(newMsg);
    input.value='';
    render();
    await saveTeamChat(newMsg);
  };
  sendBtn.addEventListener('click', send);
  document.getElementById('teamChatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

  return `

/* ---- Photos ---- */
// Resizes/re-encodes an uploaded image client-side before storing it. Photos
// are still stored as base64 text in Postgres rather than real object
// storage, so compression keeps row sizes sane — a few uncompressed phone
// photos would otherwise bloat every full-state read. Real production
// storage would move this to Supabase Storage (or S3) and store a URL
// instead of the base64 blob.
function compressImage(file, maxWidth=700, quality=0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  state.contentCredits -= amount;
  state.creditTransactions.unshift({id:'ct'+Date.now(), type:'spend', amount:-amount, reason, date:todayISO()});

}

// Every AI feature in this app (content ideas, captions, campaign copy, the
// assistant chat) calls Anthropic's Messages API the same way, so the actual
// fetch/parse/error-handling lives here once. This only succeeds when the
// app is running somewhere that can reach api.anthropic.com with the right
// auth attached (e.g. proxied by a sandboxed preview host) — on a plain
// static host this fetch will fail (no key, and the API doesn't allow
// unauthenticated cross-origin browser calls), so callers should always
// wrap this in a try/catch and show a clear fallback message.
async function callAnthropicAPI(messages, {system, max_tokens=500} = {}){
  let response;
  try{
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens,
        ...(system ? {system} : {}),
        messages
      })
    });
  }catch(networkErr){
    throw new Error('AI features aren\'t reachable from this environment — this app calls Anthropic\'s API directly from the browser, which only works when hosted behind a backend that can proxy the request.');
  }
  if(!response.ok) throw new Error('API request failed: ' + response.status);
  const data = await response.json();
  return data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}

async function generateContentIdeas(){
  const treatments = allTreatments();
  const treatmentTotals = {};
  treatments.forEach(t=>{ treatmentTotals[t.name] = (treatmentTotals[t.name]||0) + 1; });
  const topTreatments = Object.entries(treatmentTotals).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([name])=>name);
  const thisMonth = bookingCountForMonthOffset(0);
  const lastMonth = bookingCountForMonthOffset(1);
  const atRisk = getAtRiskClients();

  const prompt = `You are helping ${state.clinic.name}, a medical aesthetics clinic, plan social media content. Here is their real data:

Top treatments by volume: ${topTreatments.length ? topTreatments.join(', ') : 'not enough data yet'}
Bookings this month vs last month: ${thisMonth} vs ${lastMonth}
Clients currently at risk of lapsing: ${atRisk.length}

Suggest exactly 5 specific, concrete social media content ideas for this clinic based on this real data (e.g. if a treatment is popular, suggest content about it; if bookings dipped, suggest a re-engagement angle; if clients are at risk, suggest retention content). Each idea should be one line, specific enough to act on immediately, and should not include markdown formatting or numbering — just plain sentences, one per line, and nothing else.`;

  const text = await callAnthropicAPI([{ role: "user", content: prompt }], { max_tokens: 400 });
  return text.split('\n').map(l=>l.replace(/^[-\d.)\s]+/, '').trim()).filter(Boolean);
}

async function generateSocialCaption(contentType, treatmentContext, platforms){
  const platformNote = platforms.length ? ` Intended for: ${platforms.join(', ')}.` : '';
  const prompt = `Write a short social media caption for a ${contentType} promoting "${treatmentContext}" for ${state.clinic.name}, a medical aesthetics clinic.${platformNote} Keep it warm, professional, and compliant with typical medical-advertising norms (no exaggerated claims, no "guaranteed results" language). Then on a new line, give 6-10 relevant hashtags separated by spaces. Format your response as exactly two lines: the caption, then the hashtags line starting with #.`;

  const text = await callAnthropicAPI([{ role: "user", content: prompt }], { max_tokens: 300 });
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const hashtagLineIdx = lines.findIndex(l=>l.startsWith('#'));
  if(hashtagLineIdx === -1){
    return { caption: text, hashtags: '' };
  }
  return {
    caption: lines.slice(0, hashtagLineIdx).join(' '),
    hashtags: lines.slice(hashtagLineIdx).join(' ')
  };
}

function getAudienceClients(audience){

  return state.clients;
}

function renderCampaignModal(draft, isEdit, originalCampaign){
  const audienceCount = getAudienceClients(draft.audience).length;
  openModal(`
    <div class="modal-title">${isEdit?'Edit Campaign':'Create Campaign'}</div>
    <div class="field-group"><label>Campaign Name</label><div class="field-line"><input id="kName" type="text" value="${esc(draft.name)}" placeholder="e.g. Summer Skin Refresh"></div></div>
    <div class="field-group"><label>Type</label><div class="field-line"><select id="kType">
      <option value="Email" ${draft.type==='Email'?'selected':''}>Email</option>
      <option value="SMS" ${draft.type==='SMS'?'selected':''}>SMS</option>
    </select></div></div>
    <div class="field-group"><label>Audience</label><div class="field-line"><select id="kAudience">
      <option value="all" ${draft.audience==='all'?'selected':''}>All Clients</option>
      <option value="vip" ${draft.audience==='vip'?'selected':''}>VIP Clients</option>
      <option value="atrisk" ${draft.audience==='atrisk'?'selected':''}>At-Risk Clients</option>
      <option value="new" ${draft.audience==='new'?'selected':''}>New Clients</option>
    </select></div>
    <p class="empty-state" style="margin-top:6px;">${audienceCount} client${audienceCount===1?'':'s'} match this segment right now</p></div>
    ${draft.type==='Email' ? `
      <div class="field-group"><label>Subject</label><div class="field-line"><input id="kSubject" type="text" value="${esc(draft.subject)}" placeholder="e.g. Your skin, refreshed for summer"></div></div>` : ''}
    <div class="field-group">
      <label>Message</label>
      <textarea id="kBody" placeholder="Write your own, or generate with AI below...">${esc(draft.body)}</textarea>
      <button class="generate-ai-btn" id="generateCampaignBtn" type="button" ${state.contentCredits < CREDIT_COSTS.generateCampaignCopy ? 'disabled' : ''}>
        ${ICONS.ai} Generate with AI <span class="credit-cost-tag">(${CREDIT_COSTS.generateCampaignCopy} credits · you have ${state.contentCredits})</span>
      </button>
    </div>
    <div class="field-group"><label>Status</label><div class="field-line"><select id="kStatus">
      <option value="DRAFT" ${draft.status==='DRAFT'?'selected':''}>DRAFT</option>
      <option value="ACTIVE" ${draft.status==='ACTIVE'?'selected':''}>ACTIVE</option>
    </select></div></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveCampaign">${isEdit?'Save Changes':'Create'}</button>
    </div>`);

  document.getElementById('kType').addEventListener('change', e=>{
    draft.name = document.getElementById('kName').value;
    draft.subject = document.getElementById('kSubject') ? document.getElementById('kSubject').value : draft.subject;
    draft.body = document.getElementById('kBody').value;
    draft.type = e.target.value;
    renderCampaignModal(draft, isEdit, originalCampaign);
  });
  document.getElementById('kAudience').addEventListener('change', e=>{
    draft.audience = e.target.value;
    draft.name = document.getElementById('kName').value;
    draft.body = document.getElementById('kBody').value;
    renderCampaignModal(draft, isEdit, originalCampaign);
  });

  document.getElementById('generateCampaignBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('kName').value.trim();
    if(!name){ showToast("Give the campaign a name first so the AI knows what it's about"); return; }
    const btn = document.getElementById('generateCampaignBtn');
    btn.disabled = true; btn.textContent = 'Generating…';
    try{
      const result = await generateCampaignCopy(name, draft.type, draft.audience);
      if(!spendCredits(CREDIT_COSTS.generateCampaignCopy, `Generated ${draft.type} campaign copy for "${name}"`)){
        showToast('Not enough credits'); renderCampaignModal(draft, isEdit, originalCampaign); return;
      }
      draft.name = name;
      draft.subject = result.subject;
      draft.body = result.body;
      await saveState();
      renderCampaignModal(draft, isEdit, originalCampaign);
      showToast('Campaign copy generated');
    }catch(e){
      console.error(e);
      showToast('Could not generate right now — try again in a moment');
      renderCampaignModal(draft, isEdit, originalCampaign);
    }
  });

  document.getElementById('saveCampaign').addEventListener('click', async ()=>{
    const name = document.getElementById('kName').value.trim();
    if(!name) return;
    draft.name = name;
    draft.type = document.getElementById('kType').value;
    draft.subject = document.getElementById('kSubject') ? document.getElementById('kSubject').value : '';
    draft.body = document.getElementById('kBody').value;
    draft.audience = document.getElementById('kAudience').value;
    draft.status = document.getElementById('kStatus').value;
    draft.clients = getAudienceClients(draft.audience).length;
    if(isEdit){
      Object.assign(originalCampaign, draft);
    } else {
      state.campaigns.push({id:'k'+Date.now(), ...draft});
    }
    await saveState();
    closeModal(); render();
    showToast(isEdit ? 'Campaign updated' : 'Campaign created');
  });
}

function openCampaignSendModal(campaign){
  if(!campaign.body){
    openModal(`
      <div class="modal-title">No Content Yet</div>
      <p class="muted" style="font-size:13.5px; margin-bottom:20px;">This campaign doesn't have a message yet — edit it first to write or generate one.</p>
      <div class="modal-actions"><button class="btn btn-primary" id="cancelModal">Close</button></div>`);
    return;
  }
  const recipients = getAudienceClients(campaign.audience);
  const emailRecipients = recipients.filter(c=>c.email);
  const phoneRecipients = recipients.filter(c=>c.phone);
  const CAP = 50; // mailto:/sms: URIs have real length limits — beyond this, a real bulk provider (Phase 3) is the honest path

  openModal(`
    <div class="modal-title">Send "${esc(campaign.name)}"</div>
    <p class="muted" style="font-size:13px; margin-bottom:16px; line-height:1.6;">
      Matches ${recipients.length} client${recipients.length===1?'':'s'} in the "${esc(campaign.audience)}" segment
      (${emailRecipients.length} with an email, ${phoneRecipients.length} with a phone number).
      ${recipients.length > CAP ? `<br><strong style="color:var(--danger);">This is more than ${CAP} recipients — mailto/SMS links break down at that size. Genuine bulk sending needs a real email/SMS provider (SendGrid, Twilio) wired into the Phase 3 backend, not this hand-off.</strong>` : `This opens your own mail or messages app pre-filled — there's no backend here to send silently on your behalf, same as everywhere else in this prototype that sends something.`}
    </p>
    <div class="send-actions">
      ${campaign.type==='Email' ? `<button class="btn btn-secondary" id="sendCampaignEmailBtn" ${!emailRecipients.length || recipients.length>CAP ? 'disabled':''}>${ICONS.email} Open in Mail (BCC)</button>` : ''}
      ${campaign.type==='SMS' ? `<button class="btn btn-secondary" id="sendCampaignSmsBtn" ${!phoneRecipients.length || recipients.length>CAP ? 'disabled':''}>${ICONS.whatsapp} Open in Messages</button>` : ''}
      <button class="btn btn-secondary" id="copyRecipientsBtn">Copy Recipient List</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelModal">Close</button>
    </div>`);

  const emailBtn = document.getElementById('sendCampaignEmailBtn');
  if(emailBtn) emailBtn.addEventListener('click', ()=>{
    const bcc = emailRecipients.map(c=>c.email).join(',');
    const subject = encodeURIComponent(campaign.subject || campaign.name);
    const body = encodeURIComponent(campaign.body);
    window.open(`mailto:?bcc=${encodeURIComponent(bcc)}&subject=${subject}&body=${body}`, '_blank');
    showToast('Opened in your mail app — some mail apps trim long BCC lists, so double-check before sending');
  });
  const smsBtn = document.getElementById('sendCampaignSmsBtn');
  if(smsBtn) smsBtn.addEventListener('click', ()=>{
    const numbers = phoneRecipients.map(c=>c.phone.replace(/[^0-9+]/g,'')).join(',');
    const body = encodeURIComponent(campaign.body);
    window.open(`sms:${numbers}?body=${body}`, '_blank');
    showToast('Opened in your messages app — multi-recipient support varies by device');
  });
  document.getElementById('copyRecipientsBtn').addEventListener('click', async ()=>{
    const list = recipients.map(c=>`${c.name} — ${c.email||'no email'} — ${c.phone||'no phone'}`).join('\n');
    await copyToClipboard(list, 'Recipient list copied');
  });
}

async function generateCampaignCopy(campaignName, type, audience){
  const audienceLabel = { all:'all clients', vip:'VIP clients', atrisk:'clients at risk of lapsing', new:'new clients' }[audience] || 'clients';
  const lengthNote = type==='SMS' ? 'Keep it under 300 characters, no subject line needed.' : 'Keep it to 3-4 short paragraphs with a clear call to action.';
  const prompt = `Write ${type} marketing copy for a campaign called "${campaignName}" at ${state.clinic.name}, a medical aesthetics clinic. The audience is ${audienceLabel}. ${lengthNote} Be warm and professional, avoid exaggerated claims or "guaranteed results" language (medical advertising norms). ${type==='Email' ? 'Respond as exactly two parts: first line is the subject, then a blank line, then the email body.' : 'Respond with just the SMS body text, nothing else.'}`;

  const text = await callAnthropicAPI([{ role: "user", content: prompt }], { max_tokens: 500 });
  if(type==='SMS') return { subject:'', body:text };
  const parts = text.split('\n\n');
  return { subject: parts[0].replace(/^subject:\s*/i,'').trim(), body: parts.slice(1).join('\n\n').trim() || text };
}
