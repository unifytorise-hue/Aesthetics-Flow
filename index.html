function generateApiKey(){
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let key = 'af_live_';
  for(let i=0;i<32;i++) key += chars[Math.floor(Math.random()*chars.length)];
  return key;
}

/* ---- AI Assistant ---- */
function buildAIContext(){
  const followUps = state.clients
    .filter(c=>c.nextAction && c.nextAction.date && c.nextAction.date!=='—')
    .map(c=>`${c.name} (${c.status}) — ${c.nextAction.label}, due ${fmtDate(c.nextAction.date)}`);
  const leadSummary = state.leads.map(l=>`${l.name} (${l.source}) — ${l.stage}`);
  const inventoryAlerts = state.inventory.filter(i=>i.expiresIn).map(i=>`${i.name} expires in ${i.expiresIn} days`);
  const campaignSummary = state.campaigns.map(k=>`${k.name}: ${k.clients} clients, ${k.status}`);
  const outstandingInvoices = state.invoices
    .filter(i=>i.status!=='Paid')
    .map(i=>`${i.clientName}: ${i.type} for ${fmtMoney(invoiceTotal(i))}, status ${i.status}`);
  const atRisk = getAtRiskClients().map(c=>`${c.name} — last visit ${fmtDate(c.lastTreatment.date)}`);
  const currentLocation = state.locations.find(l=>l.id===state.currentLocationId);
  const locationBreakdown = state.locations.map(l=>{
    const apptCount = state.appointments.filter(a=>a.locationId===l.id).length;
    const clientCount = state.clients.filter(c=>c.locationId===l.id).length;
    return `${l.name}: ${clientCount} clients, ${apptCount} appointments on file`;
  });
  const clientNames = state.clients.map(c=>c.name).join(', ');
  const clientProfiles = state.clients.map(c=>
    `${c.name}: ${c.status}, skin type ${c.skinType||'unknown'}, concerns: ${c.concerns.length?c.concerns.join('/'):'none noted'}, ${c.treatments.length} treatment(s) on file, last treatment "${c.lastTreatment.name}" on ${fmtDate(c.lastTreatment.date)}`
  ).join('\n');

  return `You are the AI Assistant embedded in ${state.clinic.name}, a CRM for an aesthetics/medical clinic run by ${state.clinic.practitionerName}. You help with follow-ups, revenue insight, lead pipeline, inventory, invoicing/quoting, and marketing campaigns. Be concise, warm, and clinic-appropriate — this is a professional medical aesthetics setting.

Current clinic data:
Revenue this month: ${fmtMoney(monthlyRevenue())}
Clients on file: ${clientNames}

Client details (use this to answer "brief me on X" questions):
${clientProfiles}

Clients due for follow-up:
${followUps.length ? followUps.join('\n') : 'None currently due.'}

Sales pipeline:
${leadSummary.join('\n')}

Inventory alerts:
${inventoryAlerts.length ? inventoryAlerts.join('\n') : 'None.'}

Existing campaigns:
${campaignSummary.join('\n')}

Outstanding invoices/quotes:
${outstandingInvoices.length ? outstandingInvoices.join('\n') : 'None outstanding.'}

At-risk clients (overdue for follow-up or no visit in 90+ days):
${atRisk.length ? atRisk.join('\n') : 'None currently flagged.'}

Locations: you are currently viewing ${currentLocation ? currentLocation.name : 'an unknown location'}. Clinic has ${state.locations.length} location(s):
${locationBreakdown.join('\n')}

When it's natural and helpful, you may end your reply by asking if the person wants you to create a marketing campaign — but only when genuinely relevant. If asked to draft an invoice or quote for a specific client, confirm the client's name clearly in your reply (using their exact name as listed above) so the app can offer a button to open the invoice builder pre-filled for that client — do not attempt to state prices or line items yourself, since you don't have treatment pricing; just confirm who it's for and that you can open the builder. Keep replies short.`;
}

async function callClaude(userText){
  const history = state.aiChat.filter(m=>m.text).map(m=>({ role: m.from==='user' ? 'user' : 'assistant', content: m.text }));
  const text = await callAnthropicAPI([...history, { role: "user", content: userText }], { system: buildAIContext(), max_tokens: 1000 });
  if(!text) throw new Error('Empty response');
  return text;
}

function addTypingIndicator(){
  const win = document.getElementById('chatWindow');
  if(!win) return;
  win.appendChild(el(`<div class="chat-bubble ai" id="typingBubble">Thinking…</div>`));
  win.scrollTop = win.scrollHeight;
}
function removeTypingIndicator(){ const t=document.getElementById('typingBubble'); if(t) t.remove(); }

function bindAIAssistantEvents(){
  const win = document.getElementById('chatWindow');
  if(win) win.scrollTop = win.scrollHeight;

  document.querySelectorAll('.chat-yesno button').forEach(btn=>{
    if(btn.dataset.openBuilder){
      btn.addEventListener('click', ()=>{
        openInvoiceBuilderModal(btn.dataset.openBuilder, btn.dataset.invoiceType || 'Invoice');
      });
      return;
    }
    btn.addEventListener('click', async ()=>{
      const isYes = btn.classList.contains('yes');
      const idx = Number(btn.dataset.idx);
      if(state.aiChat[idx]) delete state.aiChat[idx].suggestCampaign;
      if(isYes){
        state.campaigns.push({id:'k'+Date.now(), name:'Repeat Booking Recovery', clients:0, status:'DRAFT'});
        state.aiChat.push({from:'ai', text:"Done — I've created a Repeat Booking Recovery campaign as a draft. You can review it under Campaigns."});
      } else {
        state.aiChat.push({from:'ai', text:'No problem, let me know if you change your mind.'});
      }
      await saveState();
      render();
    });
  });

  document.getElementById('aiSend').addEventListener('click', sendAIMessage);
  document.getElementById('aiInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendAIMessage(); });
}

async function sendAIMessage(){
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if(!text) return;
  state.aiChat.push({from:'user', text});
  input.value='';
  render();
  await runAITurn(text);
}

// Shared by the input-box flow and any programmatic trigger (e.g. "Brief Me"
// button) — assumes the user message has already been pushed to state.aiChat
// and render() called, so this only handles the request/response half.
async function runAITurn(text){
  const sendBtn = document.getElementById('aiSend');
  addTypingIndicator();
  if(sendBtn) sendBtn.disabled = true;

  try{
    const reply = await callClaude(text);
    const suggestsCampaign = /create a campaign|campaign\?/i.test(reply);
    const invoiceIntent = /\b(invoice|quote)\b/i.test(reply) || /\b(invoice|quote)\b/i.test(text);
    let suggestInvoiceFor = null;
    let suggestInvoiceType = null;
    if(invoiceIntent){
      const combined = `${text} ${reply}`;
      const mentioned = state.clients.find(c=>combined.toLowerCase().includes(c.name.toLowerCase()));
      if(mentioned){
        suggestInvoiceFor = mentioned.id;
        suggestInvoiceType = /\bquote\b/i.test(combined) && !/\binvoice\b/i.test(combined) ? 'Quote' : 'Invoice';
      }
    }
    state.aiChat.push({from:'ai', text:reply, suggestCampaign:suggestsCampaign, suggestInvoiceFor, suggestInvoiceType});
  }catch(e){
    console.error('AI request failed', e);
    state.aiChat.push({from:'ai', text:"I couldn't reach the AI service just now. Please try again in a moment."});
  }
  await saveState();
  removeTypingIndicator();
  render();
  const freshInput = document.getElementById('aiInput');
  if(freshInput) freshInput.focus();
}

/* ---------------- Auth (real Supabase Auth for both staff and the client portal) ---------------- */
// Resolving "who is this authenticated user" happens server-side via the
// is_staff() / my_client_id() Postgres functions, which check auth.uid()
// against staff.auth_user_id / clients.auth_user_id under RLS — the client
// never gets to declare its own role.
async function handleSession(session){
  if(!session){ renderStaffAuth('signin'); return; }
  const email = session.user.email;
  try{
    // Idempotent: links a pre-provisioned staff/client row to this login the
    // first time its email matches; harmless no-op on every later sign-in.
    await sb.rpc('claim_staff_account', { p_email: email });
    await sb.rpc('claim_client_account', { p_email: email });
  }catch(e){ console.error('Account linking failed', e); }

  const { data: staffFlag } = await sb.rpc('is_staff');
  if(staffFlag){ await enterStaffApp(session); return; }

  const { data: myClientId } = await sb.rpc('my_client_id');
  if(myClientId){ await enterClientPortal(myClientId); return; }

  renderPendingScreen(email);
}

async function loadClientPortalData(clientId){
  const [clientRes, treatmentsRes, invoicesRes, apptRes, brandingRes] = await Promise.all([
    sb.from('clients').select('*').eq('id', clientId).maybeSingle(),
    sb.from('treatments').select('*').eq('client_id', clientId),
    sb.from('invoices').select('*, invoice_line_items(*)').eq('client_id', clientId),
    sb.from('appointments').select('*').eq('client_id', clientId),
    sb.rpc('client_clinic_branding')
  ]);
  const c = clientRes.data;
  const branding = (brandingRes.data && brandingRes.data[0]) || {};
  return {
    client: c ? { id:c.id, name:c.name, email:c.email } : null,
    treatments: (treatmentsRes.data||[]).map(mapTreatment),
    invoices: (invoicesRes.data||[]).map(inv=>mapInvoice(inv, {[inv.id]: inv.invoice_line_items||[]})),
    appointments: (apptRes.data||[]).map(a=>({ id:a.id, date:a.date, time:a.time, service:a.service, practitioner:a.practitioner })),
    clinicName: branding.name || 'AestheticFlow'
  };
}

              <tr data-clinic-row="${c.id}">
                <td data-label="Clinic">${esc(c.name)}</td>
                <td data-label="Created">${fmtDate((c.created_at||'').slice(0,10))}</td>
                <td data-label="Staff">${c.staff_count}</td>
                <td data-label="Clients">${c.client_count}</td>
                <td data-label="Plan">
                  <select data-plan-select="${c.id}">
                    ${PLAN_OPTIONS.map(p=>`<option value="${p}" ${c.plan===p?'selected':''}>${p}</option>`).join('')}
                  </select>
                </td>
                <td data-label="Status">
                  <select data-status-select="${c.id}">
                    ${['trialing','active','past_due','canceled'].map(s=>`<option value="${s}" ${c.subscription_status===s?'selected':''}>${s}</option>`).join('')}
                  </select>
                </td>
                <td><button class="btn btn-secondary btn-sm" data-save-clinic="${c.id}">Save</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('backToStaffFromAdmin').addEventListener('click', backToStaffAppFromAdmin);
  document.querySelectorAll('[data-save-clinic]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const clinicId = btn.dataset.saveClinic;
      const plan = document.querySelector(`[data-plan-select="${clinicId}"]`).value;
      const status = document.querySelector(`[data-status-select="${clinicId}"]`).value;
      btn.disabled = true;
      try{
        const { error } = await sb.rpc('admin_set_clinic_plan', { p_clinic_id: clinicId, p_plan: plan, p_status: status });
        if(error) throw error;
        showToast('Clinic updated');
      }catch(e){
        showToast(e.message || 'Could not update clinic');
      }finally{
        btn.disabled = false;
      }
    });
  });
}

/* ---------------- Init ---------------- */
window.addEventListener('error', (e)=>{
  console.error('Uncaught error:', e.error || e.message);
  try{ showToast('⚠ Something went wrong: ' + (e.message || 'unknown error')); }catch(_){}
});
window.addEventListener('unhandledrejection', (e)=>{
  console.error('Unhandled rejection:', e.reason);
  try{ showToast('⚠ Something went wrong: ' + (e.reason && e.reason.message ? e.reason.message : 'unknown error')); }catch(_){}
});

(async function init(){
  document.getElementById('goToPortalLink').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
    renderPortalAuth('signin');
  });
  document.getElementById('goToPlatformAdminLink').addEventListener('click', enterPlatformAdmin);
  const { data:{ session } } = await sb.auth.getSession();
  await handleSession(session);
})();
</script>
</body>
